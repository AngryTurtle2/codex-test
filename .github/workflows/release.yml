name: Build and Release EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name HotkeyGuard main.py

      - name: Archive artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/HotkeyGuard.exe -DestinationPath dist/HotkeyGuard-windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotkeyGuard-windows-x64
          path: dist/HotkeyGuard-windows-x64.zip

      - name: Publish GitHub Release asset (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HotkeyGuard-windows-x64.zip
          generate_release_notes: true
